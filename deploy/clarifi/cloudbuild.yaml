steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        cp Dockerfile.clarifi.dockerignore .dockerignore
        docker build -f Dockerfile.clarifi -t '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/clarifi:${_TAG}' .
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/clarifi:${_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: us-central1
  _REPOSITORY: clarifi
  _TAG: prototype
