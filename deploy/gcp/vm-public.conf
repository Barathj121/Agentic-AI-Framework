# Only the Cloud Run gateway network tag may reach this port (GCP firewall).
# App routes are explicit. Never proxy arbitrary URL-supplied localhost ports.
map $http_upgrade $workbench_connection { default upgrade; '' close; }
server {
    listen 8080;
    server_tokens off;
    access_log off;
    client_max_body_size 26m;
    location = /apps/demo { return 308 /apps/demo/; }
    location /apps/demo/ {
        proxy_pass http://127.0.0.1:18501/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://127.0.0.1:8510;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $workbench_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}
